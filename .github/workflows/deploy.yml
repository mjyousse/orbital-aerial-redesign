name: Deploy to GitHub Pages

# Every branch is built on push so broken builds show up early, but only the
# branch named in the PAGES_BRANCH repository variable (default: main) is
# published. "Run workflow" publishes PAGES_BRANCH, or the branch typed in.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish (leave blank to use the PAGES_BRANCH variable)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pick.outputs.deploy }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        name: Decide what to build and whether to publish it
        env:
          PAGES_BRANCH: ${{ vars.PAGES_BRANCH }}
          INPUT_BRANCH: ${{ inputs.branch }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          live="${PAGES_BRANCH:-main}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ref="${INPUT_BRANCH:-$live}"
            deploy=true
          else
            ref="$REF_NAME"
            if [ "$ref" = "$live" ]; then deploy=true; else deploy=false; fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Live branch: $live. Building: $ref. Publish: $deploy." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - if: steps.pick.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The Cloudflare copy at orbital-redesign.mjyousse.workers.dev. It is built
  # again from the root (BASE_PATH=/) and its Look pill points at the glass
  # copy on Cloudflare. It runs only when the published branch is pushed and
  # the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets exist.
  cloudflare:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: secrets
        name: Check the Cloudflare secrets are set
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Skipped the Cloudflare copy: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to publish it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.ref }}
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        name: Build from the root for workers.dev
        env:
          SITE_URL: https://orbital-redesign.mjyousse.workers.dev
          BASE_PATH: /
          PUBLIC_GLASS_URL: https://orbital-glass.mjyousse.workers.dev/
        run: npm run build
      - if: steps.secrets.outputs.ok == 'true'
        name: Publish to the orbital-redesign Worker
        run: npx --yes wrangler@4 deploy
